<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫學術語測驗系統</title>
    <style>
        :root { --primary: #228be6; --star: #fab005; --bg: #f8f9fa; }
        body { font-family: sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; color: #333; }
        
        /* 全域語速控制條 - 置頂固定 */
        .global-speed-bar {
            background: white; width: 100%; max-width: 400px; padding: 12px 20px;
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px; display: flex; align-items: center; gap: 15px;
            position: sticky; top: 10px; z-index: 100;
        }
        .global-speed-bar label { font-size: 14px; font-weight: bold; white-space: nowrap; }
        .global-speed-bar input { flex-grow: 1; cursor: pointer; }

        /* 頁面容器 */
        #setupPage, #resultPage { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center;min-height: auto; margin-bottom: 50px; /*在底部留一點空間，捲動到底部時比較舒服 */ }
        .grid-chars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 15px 0; text-align: left; }
        .quick-range { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .btn-mini { padding: 6px 12px; font-size: 13px; background: #e9ecef; border: 1px solid #dee2e6; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .mode-select { margin: 10px 0; padding: 15px; background: #f1f3f5; border-radius: 10px; }
        
        /* 測驗卡片 */
        #quizPage { display: none; width: 100%; max-width: 400px; text-align: center; }
        .card { background: white; min-height: 260px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; cursor: pointer; position: relative; margin-bottom: 20px; }
        .word-main { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .word-sub { font-size: 1.1rem; color: #868e96; margin-bottom: 20px; min-height: 1.2em; word-break: break-all; }
        .ans-area { font-size: 1.6rem; color: #e8590c; font-weight: bold; visibility: hidden; background: #fff4e6; padding: 5px 15px; border-radius: 8px; }
        .ans-area.show { visibility: visible; }
        
        /* 按鈕配置優化 */
        .star-btn { position: absolute; top: 20px; right: 20px; font-size: 32px; color: #dee2e6; background: none; border: none; cursor: pointer; transition: 0.2s; line-height: 1; }
        .star-btn.active { color: var(--star); }
        .btn-speak-large { position: absolute; bottom: 20px; right: 20px; background: #e7f5ff; border: 2px solid var(--primary); border-radius: 50%; width: 60px; height: 60px; cursor: pointer; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(34,139,230,0.2); }

        .btn { border: none; padding: 14px; border-radius: 12px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; margin-bottom: 10px; }
        .btn-start { background: var(--primary); color: white; }
        .btn-next { background: var(--primary); color: white; }
        .btn-end { background: #ff6b6b; color: white; margin-top: 20px; }
        .btn-outline { background: #e9ecef; color: #495057; }

        .star-list { text-align: left; margin-top: 20px; width: 100%; }
        .star-item { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 全域語速控制條 -->
    <div class="global-speed-bar">
        <label>🗣️ 語速：<span id="rateVal">1.0</span>x</label>
        <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('rateVal').innerText = this.value">
    </div>

    <!-- 1. 設定頁面 -->
    <div id="setupPage">
        <h2 style="margin-top:0">🚑 測驗設定</h2>
        
        <div style="text-align:left; font-weight:bold; margin-bottom:10px;">快速選取本次範圍：</div>
        <div class="quick-range">
	    <button class="btn-mini" onclick="selectRange('A','C')">A - C</button>
            <button class="btn-mini" onclick="selectRange('D','H')">D - H</button>
            <button class="btn-mini" onclick="selectRange('I','N')">I - N</button>
            <button class="btn-mini" onclick="selectRange('O','R')">O - R</button>
            <button class="btn-mini" onclick="selectRange('S','Y')">S - Y</button>
        </div>

        <div class="grid-chars" id="charGrid"></div>
        <div style="text-align:right; margin-bottom:15px;">
            <small onclick="selectAll(true)" style="cursor:pointer; color:var(--primary)">全選</small> / 
            <small onclick="selectAll(false)" style="cursor:pointer; color:var(--primary)">清空</small>
        </div>

        <div class="mode-select">
            <div style="text-align:left; font-weight:bold; margin-bottom:10px;">測驗模式：</div>
            <label><input type="radio" name="quizMode" value="order" checked> 依講義順序</label>
            <label style="margin-left:20px;"><input type="radio" name="quizMode" value="random"> 隨機抽題</label>
        </div>

        <button class="btn btn-start" onclick="startQuiz()">開始測驗</button>
    </div>

    <!-- 2. 測驗頁面 -->
    <div id="quizPage">
        <div class="card" onclick="toggleAns()">
            <!-- 星星移至右上角[cite: 2] -->
            <button id="starIcon" class="star-btn" onclick="toggleStar(event)">★</button>
            
            <div class="word-main" id="displayWord">-</div>
            <div class="word-sub" id="displaySub">-</div>
            <div class="ans-area" id="displayAns">-</div>
            
            <!-- 語音按鈕位於右下角，方便操作[cite: 2] -->
            <button class="btn-speak-large" onclick="speakCurrent(event)">🔊</button>
        </div>
        <button class="btn btn-next" onclick="nextQuestion()">下一題</button>
        <button class="btn btn-outline" onclick="toggleAns()">顯示答案</button>
        <button class="btn btn-end" onclick="showResults()">結束並查看重點</button>
        <div id="quizStatus" style="margin-top:15px; color:#adb5bd; font-size:14px;"></div>
    </div>

    <!-- 3. 結果頁面[cite: 2] -->
    <div id="resultPage" class="hidden">
        <h2 style="margin-top:0">🌟 重點複習清單</h2>
        <p id="starCountDisplay"></p>
        <div class="star-list" id="starList"></div>
        <button class="btn btn-start" style="margin-top:20px;" onclick="location.reload()">回到設定頁</button>
    </div>

let quizPool = [];
let currentIndex = 0;
let starredIndices = new Set();

// 初始化字母選單[cite: 2]
const charGrid = document.getElementById('charGrid');
"ABCDEFGHIKLMNOPRSTUVWXY".split('').forEach(char => {
    charGrid.innerHTML += `<label><input type="checkbox" value="${char}" id="chk_${char}" checked> ${char}</label>`;
});

function selectAll(bool) {
    document.querySelectorAll('#charGrid input').forEach(el => el.checked = bool);
}

function selectRange(start, end) {
    selectAll(false);
    const startCode = start.charCodeAt(0);
    const endCode = end.charCodeAt(0);
    for (let i = startCode; i <= endCode; i++) {
        const char = String.fromCharCode(i);
        const chk = document.getElementById(`chk_${char}`);
        if (chk) chk.checked = true;
    }
}

function startQuiz() {
    const selectedChars = Array.from(document.querySelectorAll('#charGrid input:checked')).map(el => el.value);
    const mode = document.querySelector('input[name="quizMode"]:checked').value;

    if (selectedChars.length === 0) return alert("請至少選擇一個字母！");

    // 修改錯誤：rawData 改為 data[cite: 2]
    quizPool = data.filter(item => {
        const firstLetter = (item.a || item.n).charAt(0).toUpperCase();
        return selectedChars.includes(firstLetter);
    });

    if (quizPool.length === 0) return alert("該範圍內沒有找到單字。");

    if (mode === 'random') {
        quizPool.sort(() => Math.random() - 0.5);
    }

    currentIndex = 0;
    starredIndices.clear();
    document.getElementById('setupPage').classList.add('hidden');
    document.getElementById('quizPage').style.display = 'block';
    renderQuestion();
}

function renderQuestion() {
    const item = quizPool[currentIndex];
    document.getElementById('displayWord').innerText = item.a || item.n;
    document.getElementById('displaySub').innerText = item.a ? `(${item.n})` : "";
    document.getElementById('displayAns').innerText = item.c;
    document.getElementById('displayAns').classList.remove('show');
    
    const starIcon = document.getElementById('starIcon');
    starIcon.classList.toggle('active', starredIndices.has(item));

    document.getElementById('quizStatus').innerText = `題號：${currentIndex + 1} / ${quizPool.length}`;
    speak(item.n);
}

function toggleAns() {
    document.getElementById('displayAns').classList.toggle('show');
}

function toggleStar(e) {
    e.stopPropagation(); // 防止觸發翻牌[cite: 2]
    const item = quizPool[currentIndex];
    if (starredIndices.has(item)) {
        starredIndices.delete(item);
    } else {
        starredIndices.add(item);
    }
    document.getElementById('starIcon').classList.toggle('active');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= quizPool.length) {
        alert("測驗結束！即將顯示重點名單。");
        showResults();
    } else {
        renderQuestion();
    }
}

function showResults() {
    document.getElementById('quizPage').style.display = 'none';
    document.getElementById('resultPage').classList.remove('hidden');
    
    const listDiv = document.getElementById('starList');
    listDiv.innerHTML = "";
    
    if (starredIndices.size === 0) {
        listDiv.innerHTML = "<p style='color:#868e96; text-align:center;'>這次沒有標記任何星星喔！</p>";
    } else {
        starredIndices.forEach(item => {
            listDiv.innerHTML += `
                <div class="star-item">
                    <div>
                        <strong>${item.a || item.n}</strong><br>
                        <small>${item.a ? item.n : ''}</small>
                    </div>
                    <div style="color:var(--primary); font-weight:bold;">${item.c}</div>
                </div>
            `;
        });
    }
    document.getElementById('starCountDisplay').innerText = `你共標記了 ${starredIndices.size} 個重點單字：`;
}

function speak(txt) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(txt);
    msg.lang = 'en-US';
    // 獲取目前語速條數值[cite: 2]
    msg.rate = parseFloat(document.getElementById('speechRate').value);
    window.speechSynthesis.speak(msg);
}

function speakCurrent(e) {
    e.stopPropagation(); // 防止翻牌[cite: 2]
    speak(quizPool[currentIndex].n);
}
</script>
</body>
</html>
